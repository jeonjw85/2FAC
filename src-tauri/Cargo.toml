[package]
name = "totp-vault"
version = "0.1.4"
description = "Local-first 2FA TOTP authenticator"
authors = ["Jeongwan Jeon <jjw@jjw.kr>"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "totp_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
zeroize = { version = "1", features = ["derive", "serde"] }
rand = "0.8"
thiserror = "2"
tauri-plugin-updater = "2.10.1"
